name: Generate Toucan voice auditions

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "generate_voice_auditions.py"
      - ".github/workflows/generate-voice-auditions.yml"

jobs:
  auditions:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libsndfile1 espeak-ng libasound-dev libportaudio2 libsqlite3-dev

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install IMS-Toucan runtime
        run: |
          git clone --depth 1 --branch MassiveScaleToucan https://github.com/DigitalPhonetics/IMS-Toucan.git vendor/IMS-Toucan
          python -m pip install --upgrade pip
          pip install torch==2.4.0 torchaudio==2.4.0 --index-url https://download.pytorch.org/whl/cpu
          grep -vE '^(torch~=|torchaudio~=|gradio|pyqt5|pyqtgraph)~=' vendor/IMS-Toucan/requirements.txt > /tmp/toucan-runtime-requirements.txt
          pip install -r /tmp/toucan-runtime-requirements.txt

      - name: Generate voice auditions
        run: python generate_voice_auditions.py

      - name: Show selected candidates
        run: |
          cat output/voice-auditions/manifest.json
          ls -lh output/voice-auditions/
          ls -lh output/voice-auditions/female/
          ls -lh output/voice-auditions/male/

      - name: Upload audition pack
        uses: actions/upload-artifact@v4
        with:
          name: toucan-voice-auditions
          path: output/voice-auditions/
          if-no-files-found: error
          retention-days: 7

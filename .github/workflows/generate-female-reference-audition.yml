name: Generate female Tamil reference audition

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/generate-female-reference-audition.yml"
      - "generate_female_reference_audition.py"
      - "reference/ref16/**"

jobs:
  audition:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libsndfile1 espeak-ng libasound-dev libportaudio2 libsqlite3-dev

      - name: Reconstruct and verify three references
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reference/reconstructed

          expected=(
            "e8c362b8c764b694223886d6dc5fca3421dda5a0ed91ae21bec550e760e5e028"
            "c22e0f18102c8949694c93180845103e8d7d0608f6734c60315d615032811637"
            "e29ec89d6788686b68764ecaf425ae027d7771e421918e69ddc990ddd7216d6b"
          )

          for seg in 0 1 2; do
            count=$(find reference/ref16 -maxdepth 1 -name "seg${seg}-part*.b64" | wc -l)
            test "$count" -eq 4

            cat reference/ref16/seg${seg}-part*.b64               | tr -d '\n\r '               | base64 --decode               > reference/reconstructed/ref-${seg}.opus

            echo "${expected[$seg]}  reference/reconstructed/ref-${seg}.opus"               | sha256sum --check

            ffmpeg -y               -i reference/reconstructed/ref-${seg}.opus               -ar 16000               -ac 1               reference/reconstructed/ref-${seg}.wav

            test -s reference/reconstructed/ref-${seg}.wav

            duration=$(ffprobe -v error               -show_entries format=duration               -of default=nw=1:nk=1               reference/reconstructed/ref-${seg}.wav)

            awk -v d="$duration" 'BEGIN { exit !(d > 9.8 && d < 10.2) }'

            ffprobe -v error               -show_entries stream=sample_rate,channels               -show_entries format=duration               -of default=nw=1               reference/reconstructed/ref-${seg}.wav
          done

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install IMS-Toucan runtime
        run: |
          git clone --depth 1 --branch MassiveScaleToucan https://github.com/DigitalPhonetics/IMS-Toucan.git vendor/IMS-Toucan
          python -m pip install --upgrade pip
          pip install torch==2.4.0 torchaudio==2.4.0 --index-url https://download.pytorch.org/whl/cpu
          grep -vE '^(torch~=|torchaudio~=|gradio|pyqt5|pyqtgraph)~=' vendor/IMS-Toucan/requirements.txt > /tmp/toucan-runtime-requirements.txt
          pip install -r /tmp/toucan-runtime-requirements.txt

      - name: Generate female audition
        run: python generate_female_reference_audition.py

      - name: Show outputs
        run: |
          cat output/female-reference-audition/manifest.json
          find output/female-reference-audition -maxdepth 2 -type f -print

      - name: Upload reconstructed references
        uses: actions/upload-artifact@v4
        with:
          name: female-reference-first-30-seconds
          path: reference/reconstructed/*.wav
          if-no-files-found: error
          retention-days: 7

      - name: Upload female audition pack
        uses: actions/upload-artifact@v4
        with:
          name: female-tamil-reference-audition
          path: output/female-reference-audition/
          if-no-files-found: error
          retention-days: 7
